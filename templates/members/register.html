<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create User</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f2f5; /* Light gray background */
    }

    .header {
      background-color: #2962ff; /* Darker blue */
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    .header-left > * {
      margin-right: 15px; /* Space between header elements */
    }
    .header-right {
      display: flex;
      align-items: center;
    }

    .header-right > * {
      margin-left: 15px; /* Space between header elements */
    }

    .header a {
      color: white;
      text-decoration: none;
    }

    .container {
      padding: 20px;
    }

    .form-container {
      background-color: white;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Subtle shadow */
    }

    h1 {
      font-size: 1.5em;
      margin-bottom: 10px;
    }

    .breadcrumbs {
      font-size: 0.9em;
      margin-bottom: 20px;
      color: #777;
    }

    .breadcrumbs a {
      color: #2962ff;
      text-decoration: none;
    }

     /* Style form fields rendered with {{ form.as_p }} */
    .form-container p {
      margin-bottom: 10px; /* Spacing between form elements */
    }

    .form-container label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 0.9em;
      color: #333;
    }

    .form-container input[type="text"],
    .form-container input[type="email"],
    .form-container select,
    .form-container input[type="password"] { /* Added password input */
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1em;
      box-sizing: border-box; /* Important for consistent width */
    }

    .form-container input[type="checkbox"] {
      margin-right: 5px;
    }

    .form-container .checkbox-label {
      display: inline-block;
      font-weight: normal;
    }

    button {
      background-color: #4CAF50;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1em;
    }

    button:hover {
      background-color: #3e8e41;
    }

    .asterisk {
      color: red;
    }

    /* Mobile-friendly adjustments */
    @media (max-width: 600px) {
      .form-row {
        flex-direction: column;
      }

      .form-group {
        margin-right: 0;
        margin-bottom: 15px;
      }
    }

    /* Optional: Spacing for icons */
    .header i {
      margin-right: 5px; /* Space between icon and text */
    }

    /* Style for Django error messages (if any) */
    .errorlist {
      color: red;
      margin-bottom: 10px;
      padding-left: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
      <div class="header-left">
        <a href="#">Institution</a>
        <a href="#">Accounting</a>
        <a href="#">Reports</a>
        <a href="#">Admin</a>
        <a href="#">Self Service</a>
        <a href="#">Configuration Wizard</a>
      </div>
      <div class="header-right">
          
          <a href="#">Notifications</a>
          <a href="#">Profile</a>
      </div>

  </div>

  <div class="container">
    <div class="form-container">
      <h1>Register New members </h1>
      <div class="breadcrumbs">
        <a href="#">Home</a> / <a href="#">Users</a> / Create User
      </div>

      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
        <button type="button">Cancel</button>  
      </form>
    </div>
  </div>

  <script>
  </script>
</body>
</html>
